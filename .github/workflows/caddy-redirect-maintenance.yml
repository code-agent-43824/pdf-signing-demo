name: Inspect Caddy redirect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure pinned production host
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect live Caddy block and privileges
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'set -eu; id; sed -n "1,60p" /etc/caddy/Caddyfile; find /etc/caddy -maxdepth 3 -type f -printf "%u:%g %m %p\n"; for f in /etc/caddy/sites/mescheryakov.pro /etc/caddy/sites-enabled/mescheryakov.pro /etc/caddy/mescheryakov.pro; do if test -f "$f"; then echo "SITE=$f"; test -w "$f" && echo site-writable || echo site-not-writable; sed -n "/handle \/pdf-signing {/,/^    }/p" "$f"; fi; done; curl -sS -o /dev/null -w "caddy-admin-http=%{http_code}\n" --max-time 2 http://127.0.0.1:2019/config/'
