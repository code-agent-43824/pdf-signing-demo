name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golden-pades:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Use pinned npm
        run: npm install --global npm@10.9.8

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --require-hashes --requirement requirements.txt

      - name: Run tests, audits and reproducibility gates
        run: npm run verify

      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit \
            --requirement requirements.txt \
            --disable-pip
