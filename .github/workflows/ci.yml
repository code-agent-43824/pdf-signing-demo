name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run of every gate on main, so npm audit and pip-audit catch
    # advisories published between pushes. deploy-production runs only on push.
    - cron: '17 4 * * 1'
  # The same checks on demand, e.g. right after a Node upgrade on the server.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled and manual runs get their own groups: in the push group of main
  # a queued one would cancel a pending push run, and with it that deploy.
  group: pdf-signing-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golden-pades:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan full history for secrets
        run: ./scripts/scan-secrets.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Use pinned npm
        run: npm install --global npm@10.9.8

      - name: Bootstrap clean checkout and run all gates
        run: ./scripts/bootstrap-and-test.sh

      - name: Audit locked Python dependencies
        run: |
          .venv/bin/python -m pip install pip-audit==2.10.1
          .venv/bin/python -m pip_audit \
            --requirement requirements.txt \
            --requirement requirements-dev.txt \
            --disable-pip

      # Audits do not cover Node itself. Scheduled and manual runs only: on
      # push a new Node release would block every commit until the server is
      # upgraded.
      - name: Check for Node security releases newer than the pin
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-node-security-releases.js

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip deploy]')
    needs: golden-pades
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out verified revision
        uses: actions/checkout@v7

      - name: Configure pinned production host
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Build immutable source archive
        run: git archive --format=tar.gz --output="release-${GITHUB_SHA}.tar.gz" "${GITHUB_SHA}"

      - name: Upload and deploy with automatic rollback
        env:
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          archive="release-${GITHUB_SHA}.tar.gz"
          remote_archive="/home/openclaw/services/pdf-signing-demo/incoming/${archive}"
          ssh "$target" 'mkdir -p /home/openclaw/services/pdf-signing-demo/incoming /home/openclaw/services/pdf-signing-demo/releases'
          scp "$archive" "${target}:${remote_archive}"
          ssh "$target" "set -euo pipefail; revision='${GITHUB_SHA}'; archive='${remote_archive}'; stage=\"/home/openclaw/services/pdf-signing-demo/releases/.\${revision}.staging\"; trap 'rm -f -- \"\${archive}\"' EXIT; rm -rf -- \"\${stage}\"; mkdir -p -- \"\${stage}\"; tar -xzf \"\${archive}\" -C \"\${stage}\"; \"\${stage}/scripts/deploy-production.sh\" \"\${revision}\" \"\${stage}\""
