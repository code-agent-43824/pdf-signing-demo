# Python lint and format settings; the Ruff pin and its update are described
# in docs/SUPPLY_CHAIN.md.
# Python files only: Ruff would otherwise also format code blocks in Markdown,
# and AGENTS.md is copied unchanged.
include = ["*.py"]
line-length = 100
target-version = "py312"

[lint]
# Faults only: syntax errors, undefined names, unused imports and variables,
# statement-level mistakes. Style is the formatter's job.
select = ["E4", "E7", "E9", "F"]

[format]
# Closest to the hand-written style the scripts had before the formatter.
quote-style = "single"
